# Dedicated Redis for ONE storefront installation (P3) — never the ERP's and never shared with another
# website's installation (or, on shared infrastructure, a separate ACL user restricted to its own key
# prefix). Holds data that must not be evicted: carts, checkout attempts (idempotency keys of
# in-flight orders), order sessions, catalogue cache. Losing an in-flight attempt could let a
# timed-out order be retried under a new key, so eviction and silent data loss are not acceptable.

bind 0.0.0.0
protected-mode yes
port 6379

# Authentication: one ACL user for the storefront app; default user disabled.
# Passwords come from the secret store at container start (aclfile), never from this file.
aclfile /run/secrets/redis-storefront.acl
# The ACL user must NOT be granted: FLUSHALL FLUSHDB CONFIG DEBUG KEYS SHUTDOWN MODULE
# e.g.  user storefront on >${PASSWORD} ~bsf:* +@all -@dangerous +scan +eval +info

# Never evict: a full Redis must fail writes loudly, not drop a cart or an idempotency key.
maxmemory 1gb
maxmemory-policy noeviction

# Durability: append-only, fsync every second, plus periodic snapshots.
appendonly yes
appendfsync everysec
save 900 1
save 300 100

# Single logical database; keys are namespaced bsf:* and tenant-scoped bsf:t:{website}:*.
databases 1

timeout 0
tcp-keepalive 60
