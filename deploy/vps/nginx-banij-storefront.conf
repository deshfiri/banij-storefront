# Nginx site for ONE Banij storefront installation (see docs/vps-runbook.md).
#
# Replace STOREFRONT_DOMAIN (twice) with the website's primary host — the same value as
# domains.primary in site/site.config.json, and one of the hosts the Banij ERP has for this website:
#
#   sudo sed "s/STOREFRONT_DOMAIN/shop.example.com/g" deploy/vps/nginx-banij-storefront.conf \
#     | sudo tee /etc/nginx/sites-available/banij-storefront > /dev/null
#   sudo ln -s /etc/nginx/sites-available/banij-storefront /etc/nginx/sites-enabled/banij-storefront
#   sudo nginx -t && sudo systemctl reload nginx
#
# This file is plain HTTP on purpose: `certbot --nginx -d <domain>` then adds the 443 server, the
# certificate and the HTTP→HTTPS redirect. Production cookies are Secure, so the shop is only usable
# once HTTPS is in place.

# Requests for any name this server does not serve are closed without an answer.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name STOREFRONT_DOMAIN;

    # Small bodies only: the storefront receives form posts, never uploads.
    client_max_body_size 1m;

    # Internal routes are never served on a public name (the app refuses them too).
    location ^~ /api/internal/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        # The storefront resolves the website from Host only; pass it unchanged.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_hide_header X-Powered-By;
        # Next.js sets its own caching headers (immutable for /_next/static); none are added here.
    }
}
